spring:
  application:
    name: cats-service
  datasource:
    url: jdbc:postgresql://localhost:5435/cats_dev
    username: cats
    password: 12345
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      jakarta.persistence.sharedCache.mode: NONE
      hibernate:
        default_schema: cats
        format_sql: true

#  docker pull postgres
#  docker run -itd -e POSTGRES_DB=cats_dev -e POSTGRES_USER=cats -e POSTGRES_PASSWORD=12345 -p 5435:5432 --name cats_dev postgres


server:
  port: 9200
  servlet:
    context-path: /api
    encoding:
      enabled: true
      charset: UTF-8
      force: true

